name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: |
          pyinstaller --onefile --windowed --name "GeneradorEtiquetas" main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeneradorEtiquetas-Windows
          path: dist/GeneradorEtiquetas.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 python3-tk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: |
          pyinstaller --onefile --windowed --name "GeneradorEtiquetas" main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeneradorEtiquetas-Linux
          path: dist/GeneradorEtiquetas

  release:
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GeneradorEtiquetas-Windows
          path: release

      - uses: actions/download-artifact@v4
        with:
          name: GeneradorEtiquetas-Linux
          path: release

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/GeneradorEtiquetas.exe
            release/GeneradorEtiquetas
          generate_release_notes: true
