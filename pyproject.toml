[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "generador-etiquetas"
version = "1.0.0"
description = "Procesamiento de PDFs con datos desde Excel: extracción de imágenes, división e inserción de overlays"
requires-python = ">=3.10"
dependencies = [
    "customtkinter>=5.2.0",
    "PyMuPDF>=1.23.0",
    "pandas>=2.0.0",
    "Pillow>=10.0.0",
    "PyPDF2>=3.0.0",
    "reportlab>=4.0.0",
    "pyyaml>=6.0",
    "openpyxl>=3.1.0",
]

[project.scripts]
generador-etiquetas = "main:main"
